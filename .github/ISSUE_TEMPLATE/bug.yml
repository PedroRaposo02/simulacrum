name: Bug
description: Something in the website or desktop app doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: "Website (browser) / desktop app (Windows, macOS, Linux)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown next to the title (BETA v…).
