name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  web:
    name: Website bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - name: Precompute best builds
        run: pnpm optimize
      - run: cp data/gamedata.json apps/web/public/gamedata.json
      - run: pnpm build
      - name: Package
        run: cd apps/web/dist && zip -r "../../../simulacrum-web-${GITHUB_REF_NAME}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: simulacrum-web-*.zip

  cli:
    name: wfcalc (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            bin: wfcalc
          - os: windows-latest
            target: windows-x64
            bin: wfcalc.exe
          - os: macos-latest
            target: macos-arm64
            bin: wfcalc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p wf-cli
      - name: Package
        shell: bash
        run: |
          mkdir -p "wfcalc-${GITHUB_REF_NAME}-${{ matrix.target }}"
          cp "target/release/${{ matrix.bin }}" "wfcalc-${GITHUB_REF_NAME}-${{ matrix.target }}/"
          cp data/gamedata.json README.md "wfcalc-${GITHUB_REF_NAME}-${{ matrix.target }}/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "wfcalc-${GITHUB_REF_NAME}-${{ matrix.target }}.zip" "wfcalc-${GITHUB_REF_NAME}-${{ matrix.target }}" > /dev/null
          else
            zip -r "wfcalc-${GITHUB_REF_NAME}-${{ matrix.target }}.zip" "wfcalc-${GITHUB_REF_NAME}-${{ matrix.target }}" > /dev/null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: wfcalc-*.zip

  release:
    name: GitHub Release
    needs: [web, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${GITHUB_REF_NAME}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Simulacrum ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.zip
