[workspace]
resolver = "2"
members = ["crates/wf-data", "crates/wf-calc", "crates/wf-opt", "crates/wf-cli", "crates/wf-wasm"]
# The desktop app (Tauri) builds on its own: apps/desktop/src-tauri.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.7.0-beta.1"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wf-data = { path = "crates/wf-data" }
wf-calc = { path = "crates/wf-calc" }
wf-opt = { path = "crates/wf-opt" }

[profile.release]
opt-level = 3
lto = true
